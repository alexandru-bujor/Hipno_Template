
services:
  # Backend API Service
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: donations-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-https://fiongolden.com}
      - BASE_PATH=${BASE_PATH:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Telegram Bot Configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_APPOINTMENT_TOPIC_ID=${TELEGRAM_APPOINTMENT_TOPIC_ID}
      - TELEGRAM_PAYMENT_CHAT_ID=${TELEGRAM_PAYMENT_CHAT_ID}
      - TELEGRAM_PAYMENT_TOPIC_ID=${TELEGRAM_PAYMENT_TOPIC_ID}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
        - VITE_STRIPE_API_ENDPOINT=${VITE_STRIPE_API_ENDPOINT:-https://fiongolden.com/api/create-checkout-session}
        - VITE_API_ENDPOINT=${VITE_API_ENDPOINT:-https://fiongolden.com/api}
        - VITE_BASE_URL=/
    container_name: donations-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: donations-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
